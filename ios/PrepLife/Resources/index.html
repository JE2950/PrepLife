<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep Life">
<meta name="theme-color" content="#18233d">
<title>Prep School Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#18233d; --navy2:#22304f; --paper:#f7f2e7; --paper2:#efe7d6; --ink:#1d1d1f; --muted:#6b6658;
  --green:#2f5d46; --burgundy:#8a2433; --gold:#b8902f; --line:#e1d8c4; --good:#3f7d52; --mid:#c08a2b; --bad:#b0413e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}

/* header */
.hdr{background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:11px}
.crest{width:44px;height:48px;flex:none;position:relative}
.crest svg{width:100%;height:100%}
.crest span{position:absolute;inset:0;display:grid;place-items:center;font:700 14px Fraunces,serif;color:var(--navy);padding-bottom:4px}
.who{flex:1;min-width:0}
.who b{display:block;font:700 17px Fraunces,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;opacity:.75;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse{text-align:right;font-size:12.5px;opacity:.9}
.purse b{display:block;font:600 16px Inter;color:#f1d38a}

/* stats */
.stats{background:var(--paper2);border-bottom:1px solid var(--line);padding:9px 14px 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.stat{font-size:12px;color:var(--muted)}
.stat .row{display:flex;justify-content:space-between}
.stat b{color:var(--ink);font-weight:600}
.bar{height:7px;border-radius:4px;background:#dcd2bd;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.timebar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--green)}
.pip.on{background:var(--green)}
.warn{color:var(--bad);font-weight:600}

/* journal */
.journal{flex:1;overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
.sec h3{position:sticky;top:0;background:var(--paper);margin:0;padding:12px 0 4px;font-size:15px;color:var(--navy);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);z-index:1}
.sec h3 small{font:500 12px Inter;color:var(--muted)}
.line{padding:6px 0 6px 0;border-bottom:1px dashed #e8dfcc;font-size:14.5px}
.line.sys{color:var(--green);font-weight:500}
.line.action{color:#3d3a33}

/* nav */
.nav{background:var(--navy);display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:6px 4px calc(6px + var(--safe-b))}
.nav button{color:#d9d3c3;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.nav button .ico{font-size:21px;line-height:1.2}
.next{justify-self:center;width:80px;height:80px;margin-top:-30px;border-radius:50%;background:var(--burgundy)!important;color:#fff!important;border:4px solid var(--paper)!important;box-shadow:0 3px 10px rgba(0,0,0,.3);font-weight:700;justify-content:center;line-height:1.1}
.next .ico{font-size:24px!important}
.next:active{transform:scale(.95)}
.next[disabled]{opacity:.55}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:var(--paper);width:100%;max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;padding-bottom:var(--safe-b)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:20px;color:var(--navy)}
.x{font-size:22px;padding:2px 8px;color:var(--muted)}
.sheet-b{overflow-y:auto;padding:4px 14px 20px}
.grp{font:600 11.5px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 2px 6px}
.item{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 11px;background:#fffdf8;border:1px solid var(--line);border-radius:12px;margin-bottom:7px}
.item:active{background:var(--paper2)}
.item .e{font-size:22px;width:30px;text-align:center;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:14.5px}
.item .t small{display:block;color:var(--muted);font-size:12.5px}
.item .r{font-size:12px;color:var(--muted);flex:none;text-align:right}
.item[disabled]{opacity:.45}
.item.on{border-color:var(--green);background:#eef5ef}
.mini{height:5px;border-radius:3px;background:#dcd2bd;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:17px;color:var(--navy)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border:0}
.req{font-size:12px;margin-right:8px}
.req.ok{color:var(--good)} .req.no{color:var(--bad)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--paper2);color:var(--muted);margin-left:4px}

/* modal */
.modal{position:absolute;inset:0;z-index:30;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:20px;animation:fade .15s}
.pop{background:var(--paper);width:100%;max-width:420px;border-radius:18px;padding:20px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pop .2s ease-out;border-top:6px solid var(--burgundy)}
.pop .big{font-size:42px;text-align:center;line-height:1}
.pop h2{text-align:center;margin:8px 0 6px;color:var(--navy);font-size:21px}
.pop p{margin:0 0 14px;font-size:15.5px;text-align:center}
.choice{display:block;width:100%;padding:12px 14px;margin-top:8px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;text-align:center}
.choice:active{background:var(--navy2)}
.choice[disabled]{background:#9b9a96}
.choice.alt{background:var(--paper2);color:var(--navy);border:1px solid var(--line)}
.fx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-4px 0 12px}
.fx span{font-size:12.5px;padding:3px 9px;border-radius:12px;font-weight:600}
.fx .up{background:#e2f0e5;color:var(--good)} .fx .dn{background:#f6e1df;color:var(--bad)}

/* start + end */
.start{flex:1;overflow-y:auto;padding:calc(26px + var(--safe-t)) 20px 30px;background:var(--navy);color:#fff}
.start h1{font-size:34px;margin:10px 0 2px;text-align:center}
.start .tag{text-align:center;opacity:.75;margin:0 0 20px}
.start label{display:block;font-size:12px;opacity:.8;margin:12px 0 4px}
.start input,.start select{width:100%;padding:11px 12px;border-radius:10px;border:0;font:inherit;background:#fffdf8;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--burgundy);color:#fff;font-weight:700;font-size:16px;margin-top:18px;text-align:center}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);margin-top:10px}
.btn.green{background:var(--green)}
.bigcrest{width:84px;height:92px;margin:0 auto;display:block;position:relative}
.end{flex:1;overflow-y:auto;padding:calc(24px + var(--safe-t)) 18px 30px}
.endcard{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
.ribbon{display:inline-block;margin:10px 0 4px;padding:8px 16px;background:var(--gold);color:#fff;border-radius:6px;font:700 17px Fraunces,serif;position:relative}
.hof{font-size:13px;border-bottom:1px solid rgba(255,255,255,.15);padding:7px 0;display:flex;justify-content:space-between;gap:8px}
textarea{width:100%;height:120px;font:12px ui-monospace,monospace;border-radius:8px;border:1px solid var(--line);padding:8px}
input[type=range]{width:100%}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Prep School Life — engine. Pure logic, no DOM. Works in browser and Node. */
(function (root) {
  'use strict';
  const D = () => root.PSL_DATA;

  /* ---------- RNG (mulberry32, state kept in save) ---------- */
  function rnd(s) {
    s.rng = (s.rng + 0x6D2B79F5) >>> 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  const chance = (s, p) => rnd(s) < p;
  function wpick(s, items, wf) {
    let tot = 0;
    const ws = items.map(i => { const w = Math.max(0, wf(i) || 0); tot += w; return w; });
    if (tot <= 0) return null;
    let r = rnd(s) * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r < 0) return items[i]; }
    return items[items.length - 1];
  }
  const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
  const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];

  /* ---------- Constants ---------- */
  const VISIBLE = ['morale', 'energy', 'teaching', 'rep'];
  const HIDDEN = ['patience', 'organisation', 'charisma', 'ambition', 'karma'];
  const STAT_LABEL = { morale: 'Morale', energy: 'Energy', teaching: 'Teaching', rep: 'Reputation',
    patience: 'Patience', organisation: 'Organisation', charisma: 'Charisma', ambition: 'Ambition', karma: 'Karma' };

  const HT = [
    { term: 'Michaelmas', half: 1, season: 'michaelmas', brk: 'October half-term', rest: 0.35 },
    { term: 'Michaelmas', half: 2, season: 'michaelmas', brk: 'Christmas holidays', rest: 0.7 },
    { term: 'Lent', half: 1, season: 'lent', brk: 'February half-term', rest: 0.35 },
    { term: 'Lent', half: 2, season: 'lent', brk: 'Easter holidays', rest: 0.65 },
    { term: 'Summer', half: 1, season: 'summer', brk: 'May half-term', rest: 0.35 },
    { term: 'Summer', half: 2, season: 'summer', brk: 'summer holidays', rest: 0.95 },
  ];
  const SEASON_SPORT = { michaelmas: 'rugby', lent: 'hockey', summer: 'cricket' };
  const SEASON_SPORT_G = { michaelmas: 'hockey', lent: 'netball', summer: 'cricket' };

  const ROLES = {
    ECT:         { rank: 0, drain: 30, label: () => 'ECT', pay: () => 32900 },
    Teacher:     { rank: 1, drain: 27, label: () => 'Teacher', pay: s => Math.min(34500 + 1400 * s.career.years, 50000) },
    HoD:         { rank: 2, drain: 30, label: s => 'Head of ' + s.me.subject, pay: s => Math.min(38500 + 1400 * s.career.years, 54000) + 4500 },
    Housemaster: { rank: 2, drain: 35, label: s => s.me.gender === 'f' ? 'Housemistress' : 'Housemaster', pay: s => Math.min(38500 + 1400 * s.career.years, 54000) + 7000 },
    DoS:         { rank: 3, drain: 32, label: () => 'Director of Studies', pay: () => 62000 },
    Deputy:      { rank: 4, drain: 34, label: () => 'Deputy Head', pay: () => 72000 },
    Head:        { rank: 5, drain: 36, label: s => s.me.gender === 'f' ? 'Headmistress' : 'Headmaster', pay: s => 98000 + s.school.prestige * 9000 },
  };
  const LADDER = {
    HoD:         { from: ['Teacher'], years: 3, need: { teaching: 60 }, vac: 0.35 },
    Housemaster: { from: ['Teacher', 'HoD'], years: 5, need: { rep: 58 }, boarding: true, vac: 0.25 },
    DoS:         { from: ['HoD'], years: 7, need: { teaching: 70, rep: 62 }, vac: 0.2 },
    Deputy:      { from: ['Housemaster', 'DoS'], years: 10, need: { rep: 70 }, vac: 0.18 },
    Head:        { from: ['Deputy'], years: 13, need: { rep: 76 }, external: true, vac: 0.35 },
  };

  /* ---------- Formatting helpers ---------- */
  const htLabel = s => `${HT[s.ht].term} ½${HT[s.ht].half} · ${s.ay}/${String((s.ay + 1) % 100).padStart(2, '0')}`;
  const roleLabel = (s, r) => ROLES[r || s.career.role].label(s);
  const myName = s => `${s.me.title} ${s.me.last}`;
  const sport = s => (s.school.gender === 'girls' ? SEASON_SPORT_G : SEASON_SPORT)[HT[s.ht].season];
  const money = n => (n < 0 ? '-£' : '£') + Math.abs(Math.round(n)).toLocaleString('en-GB');

  function dispName(p) {
    if (!p) return 'someone';
    if (p.role === 'pupil') return `${p.first} ${p.last}`;
    if (['partner', 'child'].includes(p.role)) return p.first;
    if (p.role === 'parent') return `${p.title} ${p.last}`;
    return `${p.title} ${p.last}`;
  }
  function personRoleLabel(s, p) {
    switch (p.role) {
      case 'head': return s.school.gender === 'girls' || p.g === 'f' ? 'Headmistress' : 'Headmaster';
      case 'deputy': return 'Deputy Head';
      case 'hod': return 'Head of ' + s.me.subject;
      case 'bursar': return 'Bursar';
      case 'matron': return 'Matron';
      case 'colleague': return p.subject ? 'Teaches ' + p.subject : 'Colleague';
      case 'pupil': { const t = D().pupilTypes.find(x => x.id === p.type); return 'Year ' + p.year + (p.boarder ? ' · boarder' : '') + (t ? ' · ' + t.label : ''); }
      case 'slt': return 'Assistant Head (Teaching and Learning)';
      case 'parent': { const c = s.people.find(x => x.id === p.childId); return c ? 'Parent of ' + c.first : 'Parent'; }
      case 'partner': return s.flags.married ? (p.g === 'f' ? 'Wife' : 'Husband') : s.flags.engaged ? (p.g === 'f' ? 'Fiancée' : 'Fiancé') : 'Partner';
      case 'child': return (p.g === 'f' ? 'Daughter' : 'Son') + ' · age ' + p.age;
      default: return p.role;
    }
  }

  /* ---------- People ---------- */
  let pid = 0;
  function makePerson(s, role, extra = {}) {
    const N = D().names;
    let g = extra.g;
    if (!g) {
      if (role === 'pupil') g = s.school.gender === 'boys' ? 'm' : s.school.gender === 'girls' ? 'f' : pick(s, ['m', 'f']);
      else if (role === 'partner') g = s.me.gender === 'm' ? (chance(s, 0.9) ? 'f' : 'm') : (chance(s, 0.9) ? 'm' : 'f');
      else g = pick(s, ['m', 'f']);
    }
    const kid = role === 'pupil' || role === 'child';
    const first = kid ? pick(s, g === 'm' ? N.boys : N.girls) : pick(s, g === 'm' ? N.men : N.women);
    const p = {
      id: 'p' + (s.nextId++), role, g, first,
      last: extra.last || (role === 'child' ? s.me.last : pick(s, N.surnames)),
      title: g === 'm' ? 'Mr' : pick(s, ['Mrs', 'Ms', 'Mrs', 'Miss']),
      rel: extra.rel != null ? extra.rel : ri(s, 40, 60),
      temper: ri(s, 0, 100), kindness: ri(s, 0, 100),
      quirk: pick(s, D().quirks), seen: s.tick,
    };
    if (role === 'head' || role === 'deputy') p.title = chance(s, 0.25) ? 'Dr' : p.title;
    if (role === 'colleague') p.subject = pick(s, D().subjects.filter(x => x !== s.me.subject));
    if (role === 'pupil') { p.year = extra.year || ri(s, 3, 8); p.boarder = s.school.boarding && chance(s, 0.7); p.type = pick(s, D().pupilTypes).id; }
    if (role === 'child') p.age = 0;
    for (const k in extra) if (extra[k] !== undefined) p[k] = extra[k];
    if (!extra.last && !['pupil', 'child', 'parent', 'partner'].includes(role)) {
      const used = s.people.map(x => x.last).concat([s.me.last]);
      let n = 0; while (used.includes(p.last) && n++ < 30) p.last = pick(s, N.surnames);
    }
    s.people.push(p);
    return p;
  }

  const STAFF_ROLES = ['head', 'deputy', 'hod', 'bursar', 'matron', 'colleague', 'slt'];
  function stashStaff(s) {
    s.world = s.world || {};
    s.world[s.school.id] = { people: s.people.filter(p => STAFF_ROLES.includes(p.role)), left: s.ay };
  }
  function staffSchool(s) {
    s.people = s.people.filter(p => ['partner', 'child'].includes(p.role));
    const back = s.world && s.world[s.school.id];
    if (back) {
      back.people.forEach(p => { p.seen = s.tick; s.people.push(p); });
      if (!['HoD', 'DoS', 'Deputy', 'Head'].includes(s.career.role) && !byRole(s, 'hod')) makePerson(s, 'hod', { rel: 50 });
      s.flags.returned = true;
    } else {
      const sr = smod(s, 'staffRel', 50);
      makePerson(s, 'head', { rel: smod(s, 'headRel', 50) });
      makePerson(s, 'deputy', { rel: 50 });
      makePerson(s, 'slt', { rel: 45 });
      if (!['HoD', 'DoS', 'Deputy', 'Head'].includes(s.career.role)) makePerson(s, 'hod', { rel: sr });
      makePerson(s, 'bursar', { rel: 45 });
      makePerson(s, 'matron', { g: 'f', title: 'Mrs', rel: sr });
      for (let i = 0; i < 3; i++) makePerson(s, 'colleague', { rel: ri(s, sr - 8, sr + 8) });
    }
    for (let i = 0; i < 4; i++) addPupil(s);
    if (s.career.role === 'Head') s.people = s.people.filter(p => p.role !== 'head');
    if (s.career.role === 'Deputy') s.people = s.people.filter(p => p.role !== 'deputy');
    if (['HoD', 'DoS', 'Deputy', 'Head'].includes(s.career.role)) s.people = s.people.filter(p => p.role !== 'hod');
  }
  function addPupil(s, year) {
    const p = makePerson(s, 'pupil', { rel: ri(s, 40, 65), year: year || ri(s, 3, 8) });
    if (chance(s, 0.6)) makePerson(s, 'parent', { last: p.last, childId: p.id, rel: 50 });
    return p;
  }
  const byRole = (s, r) => s.people.find(p => p.role === r);

  function makeSchool(s, exclude, forceId) {
    const pool = D().schools.filter(x => x.id !== exclude);
    const t = (forceId && D().schools.find(x => x.id === forceId)) || pick(s, pool);
    return { id: t.id, name: t.name, nick: t.nick, town: t.town, boarding: t.boarding, gender: t.gender, prestige: t.prestige };
  }
  function smod(s, k, def) { const t = D().schools.find(x => x.id === s.school.id); return t && t.mods && t.mods[k] != null ? t.mods[k] : def; }

  /* ---------- New game ---------- */
  function newGame(o = {}, seed) {
    const s = {
      v: 1, rng: (seed != null ? seed : Math.floor(Math.random() * 4294967296)) >>> 0,
      tick: 0, ht: 0, ay: o.year || 2026, nextId: 1,
      flags: {}, counters: { schools: 1 }, cd: {}, fired: {}, queue: [], pending: [], log: [],
      time: 4, maxTime: 4, sincePopup: 0, holiday: null, study: null, over: false,
    };
    const N = D().names;
    const g = o.gender === 'm' || o.gender === 'f' ? o.gender : pick(s, ['m', 'f']);
    s.me = {
      gender: g,
      first: o.first || pick(s, g === 'm' ? N.men : N.women),
      last: o.last || pick(s, N.surnames),
      title: o.title || (g === 'm' ? 'Mr' : pick(s, ['Ms', 'Miss', 'Mrs'])),
      subject: o.subject || pick(s, D().subjects),
      age: o.age || ri(s, 22, 25),
    };
    s.school = makeSchool(s, null, o.school && o.school !== 'random' ? o.school : null);
    s.stats = { morale: ri(s, 62, 80), energy: ri(s, 80, 92), teaching: ri(s, 28, 42), rep: ri(s, 42, 55) };
    s.hidden = {}; HIDDEN.forEach(k => s.hidden[k] = ri(s, 25, 75));
    s.money = ri(s, 400, 2500);
    s.home = { type: 'flat', label: 'Rented flat', cost: 1700 };
    s.career = { role: 'ECT', years: 0, yearsInRole: 0, yearsAtSchool: 0, perf: 50, resp: [], applied: {},
      inductionFails: 0, team: null, history: [{ school: s.school.name, from: s.ay }], peak: 'ECT' };
    s.people = [];
    staffSchool(s);
    rollVacancies(s);
    newSection(s);
    log(s, `You join ${s.school.name}, a ${s.school.boarding ? 'boarding' : 'day'} prep school ${s.school.town}, as an ECT in ${s.me.subject}.`, 'sys');
    // schedule first inspection
    s.queue.push({ id: 'inspection', at: ri(s, 4, 18), ctx: {} });
    startEvent(s, 'first_day');
    return s;
  }

  /* ---------- Log ---------- */
  function newSection(s) { s.log.push({ h: htLabel(s), sub: 'Age ' + s.me.age, lines: [] }); if (s.log.length > 400) s.log.shift(); }
  function log(s, t, k = 'event') { s.log[s.log.length - 1].lines.push({ t, k }); }

  /* ---------- Values & conditions ---------- */
  function getVal(s, k) {
    if (k in s.stats) return s.stats[k];
    if (k in s.hidden) return s.hidden[k];
    switch (k) {
      case 'money': return s.money;
      case 'age': return s.me.age;
      case 'years': return s.career.years;
      case 'yearsInRole': return s.career.yearsInRole;
      case 'yearsAtSchool': return s.career.yearsAtSchool;
      case 'rank': return ROLES[s.career.role].rank;
      case 'prestige': return s.school.prestige;
      case 'perf': return s.career.perf;
      case 'time': return s.time;
    }
    if (k.startsWith('c:')) return s.counters[k.slice(2)] || 0;
    return 0;
  }
  function cmp(v, e) {
    if (Array.isArray(e)) return v >= e[0] && v <= e[1];
    if (typeof e === 'number') return v >= e;
    const m = /^(<=|>=|<|>|==|!=)?\s*(-?[\d.]+)$/.exec(String(e).trim());
    if (!m) return true;
    const n = +m[2];
    switch (m[1]) { case '<': return v < n; case '<=': return v <= n; case '>': return v > n; case '==': return v === n; case '!=': return v !== n; default: return v >= n; }
  }
  function check(s, w, ctx) {
    if (!w) return true;
    const rank = ROLES[s.career.role].rank;
    if (w.role && !arr(w.role).includes(s.career.role)) return false;
    if (w.notRole && arr(w.notRole).includes(s.career.role)) return false;
    if (w.minRank != null && rank < w.minRank) return false;
    if (w.maxRank != null && rank > w.maxRank) return false;
    if (w.ht != null && !arr(w.ht).includes(s.ht)) return false;
    if (w.season && !arr(w.season).includes(HT[s.ht].season)) return false;
    if (w.boarding != null && s.school.boarding !== w.boarding) return false;
    if (w.schoolGender && !arr(w.schoolGender).includes(s.school.gender)) return false;
    if (w.subject && !arr(w.subject).includes(s.me.subject)) return false;
    if (w.school && !arr(w.school).includes(s.school.id)) return false;
    if (w.notSchool && arr(w.notSchool).includes(s.school.id)) return false;
    if (w.gender && s.me.gender !== w.gender) return false;
    if (w.flags && !arr(w.flags).every(f => s.flags[f])) return false;
    if (w.any && !arr(w.any).some(f => s.flags[f])) return false;
    if (w.not && arr(w.not).some(f => s.flags[f])) return false;
    if (w.has && !arr(w.has).every(r => s.people.some(p => p.role === r))) return false;
    if (w.hasNot && arr(w.hasNot).some(r => s.people.some(p => p.role === r))) return false;
    if (w.age != null && !cmp(s.me.age, w.age)) return false;
    if (w.stat) for (const k in w.stat) if (!cmp(getVal(s, k), w.stat[k])) return false;
    if (w.test && !w.test(s, ctx || {}, API)) return false;
    return true;
  }
  function matchSpec(s, p, spec) {
    if (typeof spec === 'string') {
      if (spec === 'staff') return STAFF_ROLES.includes(p.role);
      if (spec === 'boarder') return p.role === 'pupil' && p.boarder;
      return p.role === spec;
    }
    if (spec.role && !arr(spec.role).includes(p.role) && !(arr(spec.role).includes('staff') && matchSpec(s, p, 'staff'))) return false;
    if (spec.year && !cmp(p.year || 0, spec.year)) return false;
    if (spec.rel && !cmp(p.rel, spec.rel)) return false;
    if (spec.boarder != null && !!p.boarder !== spec.boarder) return false;
    if (spec.g && p.g !== spec.g) return false;
    if (spec.type && !arr(spec.type).includes(p.type)) return false;
    if (spec.age && !cmp(p.age || 0, spec.age)) return false;
    return true;
  }
  function resolveCast(s, cast, ctx) {
    ctx.cast = ctx.cast || {};
    for (const slot in (cast || {})) {
      if (ctx.cast[slot] && s.people.some(p => p.id === ctx.cast[slot])) continue;
      if (ctx.cast[slot]) return false; // that person has gone; drop the follow-up
      const used = Object.values(ctx.cast);
      const pool = s.people.filter(p => matchSpec(s, p, cast[slot]) && !used.includes(p.id));
      if (!pool.length) return false;
      ctx.cast[slot] = pick(s, pool).id;
    }
    return true;
  }
  function personFor(s, ctx, slot) {
    if (ctx && ctx.cast && ctx.cast[slot]) return s.people.find(p => p.id === ctx.cast[slot]);
    if (['head', 'deputy', 'hod', 'bursar', 'matron', 'partner', 'slt'].includes(slot)) return byRole(s, slot);
    return null;
  }

  /* ---------- Text tokens ---------- */
  function fmt(s, str, ctx = {}) {
    if (!str) return '';
    if (typeof str === 'function') str = str(s, ctx, API);
    return String(str).replace(/\{([\w.]+)\}/g, (m, key) => {
      const [a, b] = key.split('.');
      switch (a) {
        case 'me': return myName(s);
        case 'first': return s.me.first;
        case 'last': return s.me.last;
        case 'school': return s.school.name;
        case 'nick': return s.school.nick || s.school.name;
        case 'town': return s.school.town;
        case 'subject': return s.me.subject;
        case 'sport': return sport(s);
        case 'role': return roleLabel(s);
        case 'term': return HT[s.ht].term;
        case 'year': return s.ay + '/' + String((s.ay + 1) % 100).padStart(2, '0');
        case 'sir': return s.me.gender === 'f' ? 'Miss' : 'Sir';
        case 'years': return String(s.career.years);
        case 'team': return s.career.team || 'U11B';
        case 'target': return ctx.target ? roleLabel(s, ctx.target) : '';
        case 'rival': return ctx.rival || (ctx.rival = pick(s, D().names.rivals));
        case 'senior': return ctx.senior || (ctx.senior = pick(s, D().names.senior[s.school.gender === 'girls' ? 'girls' : 'boys']));
        case 'newschool': return ctx.newSchool ? ctx.newSchool.name : '';
      }
      if (ctx.vars && a in ctx.vars) return ctx.vars[a];
      const p = personFor(s, ctx, a);
      if (p) {
        switch (b) {
          case undefined: return dispName(p);
          case 'first': return p.first;
          case 'last': return p.last;
          case 'full': return p.first + ' ' + p.last;
          case 'he': return p.g === 'f' ? 'she' : 'he';
          case 'He': return p.g === 'f' ? 'She' : 'He';
          case 'him': return p.g === 'f' ? 'her' : 'him';
          case 'his': return p.g === 'f' ? 'her' : 'his';
          case 'himself': return p.g === 'f' ? 'herself' : 'himself';
          case 'His': return p.g === 'f' ? 'Her' : 'His';
          case 'year': return 'Year ' + p.year;
          case 'role': return personRoleLabel(s, p);
          case 'child': { const c = s.people.find(x => x.id === p.childId); return c ? c.first : 'their child'; }
          case 'subject': return p.subject || 'Maths';
          case 'quirk': return p.quirk;
        }
      }
      const FALL = { slt: 'the Assistant Head', head: 'the Head', deputy: 'the Deputy Head', hod: 'your Head of Department', bursar: 'the Bursar', matron: 'Matron', partner: 'your partner' };
      if (FALL[a]) return FALL[a];
      return m;
    });
  }

  /* ---------- Effects ---------- */
  function applyFx(s, fx, ctx = {}) {
    const sum = [];
    if (!fx) return sum;
    for (const k of VISIBLE) if (fx[k]) {
      const before = s.stats[k]; s.stats[k] = clamp(before + fx[k]);
      const d = Math.round(s.stats[k] - before); if (d) sum.push({ k: STAT_LABEL[k], d });
    }
    for (const k of HIDDEN) if (fx[k]) s.hidden[k] = clamp(s.hidden[k] + fx[k]);
    if (fx.money) { s.money += fx.money; sum.push({ k: 'Money', d: fx.money, money: true }); }
    if (fx.perf) s.career.perf = clamp(s.career.perf + fx.perf);
    if (fx.time) s.time = Math.max(0, s.time + fx.time);
    if (fx.rel) for (const slot in fx.rel) {
      const p = personFor(s, ctx, slot);
      if (p) { const b = p.rel; p.rel = clamp(p.rel + fx.rel[slot]); p.seen = s.tick; const d = Math.round(p.rel - b); if (d) sum.push({ k: dispName(p), d }); }
    }
    arr(fx.flag).forEach(f => s.flags[f] = true);
    arr(fx.unflag).forEach(f => delete s.flags[f]);
    if (fx.count) {
      const c = typeof fx.count === 'string' ? { [fx.count]: 1 } : fx.count;
      for (const k in c) s.counters[k] = (s.counters[k] || 0) + c[k];
    }
    arr(fx.schedule).forEach(sc => s.queue.push({ id: sc.id, at: s.tick + (sc.in || 1), ctx: sc.keep === false ? {} : JSON.parse(JSON.stringify(ctx)) }));
    arr(fx.start).forEach(id => startEvent(s, id, JSON.parse(JSON.stringify(ctx))));
    if (fx.newPerson) arr(fx.newPerson).forEach(np => {
      const p = np.role === 'pupil' ? addPupil(s, np.year) : makePerson(s, np.role, np.extra || {});
      if (np.slot) { ctx.cast = ctx.cast || {}; ctx.cast[np.slot] = p.id; }
    });
    if (fx.removePerson) arr(fx.removePerson).forEach(slot => { const p = personFor(s, ctx, slot); if (p) removePerson(s, p); });
    if (fx.addResp) addResp(s, fx.addResp);
    if (fx.removeResp) removeResp(s, fx.removeResp);
    if (fx.team) s.career.team = fx.team;
    if (fx.promote) promote(s, fx.promote === true ? ctx.target : fx.promote, ctx);
    if (fx.moveSchool) moveSchool(s, ctx.newSchool || null, fx.moveSchool === true ? null : fx.moveSchool);
    if (fx.home) s.home = Object.assign({}, fx.home);
    if (fx.log) log(s, fmt(s, fx.log, ctx), 'sys');
    if (fx.run) fx.run(s, ctx, API);
    if (fx.ending) endGame(s, fx.ending, ctx);
    return sum;
  }
  function removePerson(s, p) {
    s.people = s.people.filter(x => x.id !== p.id && !(x.role === 'parent' && x.childId === p.id));
  }

  /* ---------- Outcomes ---------- */
  function normOutcomes(o) {
    if (o.outcomes) return o.outcomes;
    return [{ w: 1, text: o.text, fx: o.fx, title: o.title }];
  }
  function outcomeWeight(s, o, ctx) {
    let w = o.w != null ? o.w : 1;
    if (o.by) for (const k in o.by) w += o.by[k] * (getVal(s, k) - 50);
    if (o.byRel) for (const slot in o.byRel) { const p = personFor(s, ctx, slot); if (p) w += o.byRel[slot] * (p.rel - 50); }
    if (o.wfn) w += o.wfn(s, ctx, API);
    if (o.when && !check(s, o.when, ctx)) w = 0;
    return Math.max(o.when ? 0 : 1, w);
  }
  function rollOutcome(s, outs, ctx) { return wpick(s, outs, o => outcomeWeight(s, o, ctx)) || outs[0]; }

  /* ---------- Events ---------- */
  const evById = id => D().events.find(e => e.id === id);
  function eventWeight(s, e, ctx) {
    let w = e.weight != null ? e.weight : 10;
    for (const m of (e.mods || [])) if (check(s, m.when, ctx)) w *= m.x;
    return w;
  }
  function eligible(s, e) {
    if (e.manual) return false;
    if (e.once && s.fired[e.id]) return false;
    const cd = e.cooldown != null ? e.cooldown : (e.choices ? 12 : 6);
    if (s.cd[e.id] != null && s.tick - s.cd[e.id] < cd) return false;
    return check(s, e.when, {});
  }
  function markFired(s, e) { s.fired[e.id] = (s.fired[e.id] || 0) + 1; s.cd[e.id] = s.tick; }

  function prep(s, e, ctx) {
    if (e.setup) e.setup(s, ctx, API);
    return resolveCast(s, e.cast, ctx);
  }
  function startEvent(s, id, ctx = {}) {
    const e = evById(id);
    if (!e) return false;
    if (!prep(s, e, ctx)) return false;
    if (e.choices) { s.pending.push({ id, ctx }); markFired(s, e); return true; }
    runPassive(s, e, ctx); return true;
  }
  function runPassive(s, e, ctx) {
    markFired(s, e);
    if (e.outcomes) {
      const o = rollOutcome(s, e.outcomes, ctx);
      const t = fmt(s, o.text || e.text, ctx); if (t) log(s, (e.emoji ? e.emoji + ' ' : '') + t);
      applyFx(s, o.fx, ctx);
    } else {
      const t = fmt(s, e.text, ctx); if (t) log(s, (e.emoji ? e.emoji + ' ' : '') + t);
      applyFx(s, e.fx, ctx);
    }
  }

  function rollEvents(s) {
    const pool = D().events.filter(e => eligible(s, e));
    const pops = pool.filter(e => e.choices), pass = pool.filter(e => !e.choices);
    let nPop = s.pending.length ? 0 : wpick(s, [0, 1, 2], n => [22, 58, 20][n]);
    if (s.sincePopup >= 2 && nPop === 0 && !s.pending.length) nPop = 1;
    const nPass = wpick(s, [0, 1, 2, 3], n => [10, 40, 35, 15][n]);
    const draw = (list, n, fn) => {
      const avail = list.slice();
      let got = 0, guard = 0;
      while (got < n && avail.length && guard++ < 40) {
        const e = wpick(s, avail, x => eventWeight(s, x, {}));
        if (!e) break;
        avail.splice(avail.indexOf(e), 1);
        const ctx = {};
        if (!prep(s, e, ctx)) continue;
        fn(e, ctx); got++;
      }
      return got;
    };
    const gotPop = draw(pops, nPop, (e, ctx) => { s.pending.push({ id: e.id, ctx }); markFired(s, e); });
    draw(pass, nPass, (e, ctx) => runPassive(s, e, ctx));
    s.sincePopup = (gotPop || s.pending.length) ? 0 : s.sincePopup + 1;
  }

  function currentEvent(s) {
    const pnd = s.pending[0]; if (!pnd) return null;
    const e = evById(pnd.id); if (!e) { s.pending.shift(); return currentEvent(s); }
    return {
      id: e.id, emoji: e.emoji || '📜', title: fmt(s, e.title, pnd.ctx), text: fmt(s, e.text, pnd.ctx),
      choices: e.choices.filter(c => !c.show || check(s, c.show, pnd.ctx)).map((c, i) => ({
        i: e.choices.indexOf(c), label: fmt(s, c.label, pnd.ctx), ok: !c.need || check(s, c.need, pnd.ctx), why: c.why || '',
      })),
    };
  }
  function choose(s, i) {
    const pnd = s.pending[0]; if (!pnd) return null;
    const e = evById(pnd.id), c = e.choices[i];
    if (!c || (c.need && !check(s, c.need, pnd.ctx))) return null;
    const ctx = pnd.ctx;
    const o = rollOutcome(s, normOutcomes(c), ctx);
    s.pending.shift();
    const text = fmt(s, o.text, ctx);
    if (text) log(s, (e.emoji ? e.emoji + ' ' : '') + text);
    const fx = applyFx(s, o.fx, ctx);
    return { emoji: e.emoji, title: fmt(s, o.title || e.title, ctx), text, fx };
  }

  /* ---------- Actions ---------- */
  function actions(s, tab) {
    return D().actions.filter(a => a.tab === tab && check(s, a.show || a.when, {})).map(a => ({
      id: a.id, emoji: a.emoji, label: fmt(s, a.label, {}), sub: fmt(s, a.sub, {}), group: a.group || '',
      cost: a.cost != null ? a.cost : 1, ok: check(s, a.when, {}) && s.time >= (a.cost != null ? a.cost : 1) && (!a.need || check(s, a.need, {})),
      why: a.why || '', moneyCost: a.moneyCost,
    }));
  }
  function doAction(s, id, personId) {
    const list = personId ? D().personActions : D().actions;
    const a = list.find(x => x.id === id);
    if (!a || s.over || s.pending.length) return null;
    const cost = a.cost != null ? a.cost : 1;
    const ctx = { cast: personId ? { them: personId } : {} };
    if (personId) { const p = s.people.find(x => x.id === personId); if (!p) return null; }
    if (!check(s, a.when, ctx) || (a.need && !check(s, a.need, ctx)) || s.time < cost) return null;
    if (!resolveCast(s, a.cast, ctx)) return { emoji: a.emoji, title: fmt(s, a.label, ctx), text: 'Nobody suitable is around.', fx: [] };
    s.time -= cost;
    s.counters['act_' + id] = (s.counters['act_' + id] || 0) + 1;
    if (a.start) { startEvent(s, a.start, ctx); return { started: true }; }
    const o = rollOutcome(s, normOutcomes(a), ctx);
    const text = fmt(s, o.text, ctx);
    if (text) log(s, (a.emoji ? a.emoji + ' ' : '') + text, 'action');
    const fx = applyFx(s, o.fx, ctx);
    return { emoji: a.emoji, title: fmt(s, o.title || a.label, ctx), text, fx };
  }
  function personActions(s, personId) {
    const p = s.people.find(x => x.id === personId); if (!p) return [];
    const ctx = { cast: { them: personId } };
    return D().personActions.filter(a => arr(a.roles).includes(p.role) && check(s, a.show, ctx)).map(a => ({
      id: a.id, emoji: a.emoji, label: fmt(s, a.label, ctx), sub: fmt(s, a.sub, ctx), cost: a.cost != null ? a.cost : 1,
      ok: check(s, a.when, ctx) && (!a.need || check(s, a.need, ctx)) && s.time >= (a.cost != null ? a.cost : 1), why: a.why || '',
    }));
  }

  /* ---------- Career ---------- */
  function ladder(s) {
    const out = [];
    for (const r in LADDER) {
      const L = LADDER[r];
      if (!L.from.includes(s.career.role)) continue;
      if (L.boarding && !s.school.boarding) continue;
      const reqs = [{ label: `${L.years}+ years teaching`, ok: s.career.years >= L.years }];
      for (const k in L.need) reqs.push({ label: `${STAT_LABEL[k]} ${L.need[k]}+`, ok: s.stats[k] >= L.need[k] });
      const applied = s.career.applied[r] === s.ay;
      const vacant = !!(s.vacancies && s.vacancies[r]);
      out.push({ role: r, label: roleLabel(s, r), reqs, external: !!L.external, applied, vacant,
        ok: reqs.every(x => x.ok) && vacant && !applied && s.time >= 1 && [2, 3, 4].includes(s.ht) });
    }
    return out;
  }
  function apply(s, role) {
    const L = ladder(s).find(x => x.role === role);
    if (!L || !L.ok) return null;
    s.time -= 1; s.career.applied[role] = s.ay;
    const ctx = { target: role };
    if (LADDER[role].external) ctx.newSchool = makeSchool(s, s.school.id);
    startEvent(s, 'interview', ctx);
    return true;
  }
  function promote(s, role, ctx) {
    if (!ROLES[role]) return;
    if (ctx && ctx.newSchool && LADDER[role] && LADDER[role].external) moveSchool(s, ctx.newSchool, role);
    s.career.role = role; s.career.yearsInRole = 0;
    if (ROLES[role].rank > ROLES[s.career.peak].rank) s.career.peak = role;
    // remove the person who used to hold the post
    const holder = { HoD: 'hod', Deputy: 'deputy', Head: 'head' }[role];
    if (holder) s.people = s.people.filter(p => p.role !== holder);
    if (role === 'DoS' && !byRole(s, 'hod')) makePerson(s, 'hod');
    if (role === 'Housemaster' || (role === 'Head' && s.school.boarding)) s.home = { type: 'school', label: role === 'Head' ? "The Head's House" : 'Boarding house flat', cost: 0 };
    log(s, `You are now ${roleLabel(s)}.`, 'sys');
  }
  function moveSchool(s, school, role) {
    stashStaff(s);
    s.school = school || makeSchool(s, s.school.id);
    s.counters.schools = (s.counters.schools || 1) + 1;
    s.career.yearsAtSchool = 0; s.career.resp.forEach(r => delete s.flags[r]); s.career.resp = []; s.career.team = null;
    if (role) s.career.role = role;
    s.career.history.push({ school: s.school.name, from: s.ay });
    if (s.home.type === 'school') s.home = { type: 'flat', label: 'Rented flat', cost: 1700 };
    staffSchool(s);
    s.stats.rep = clamp(s.stats.rep - 10);
    log(s, `You start at ${s.school.name}, ${s.school.town}.`, 'sys');
  }
  function respList(s) {
    return D().resp.filter(r => check(s, r.show, {})).map(r => ({
      id: r.id, emoji: r.emoji, label: fmt(s, r.label, {}), sub: fmt(s, r.sub, {}), on: s.career.resp.includes(r.id),
      ok: s.career.resp.includes(r.id) || (check(s, r.when, {}) && s.time >= 1), why: r.why || '', drain: r.drain,
    }));
  }
  function findResp(s, id) { return D().resp.find(x => x.id === id && check(s, x.show, {})) || D().resp.find(x => x.id === id); }
  function addResp(s, id) {
    const r = findResp(s, id); if (!r || s.career.resp.includes(id)) return;
    s.career.resp.push(id); s.flags[id] = true;
    if (r.onAdd) applyFx(s, r.onAdd, {});
  }
  function removeResp(s, id) {
    s.career.resp = s.career.resp.filter(x => x !== id); delete s.flags[id];
    if (id === 'coach') s.career.team = null;
  }
  function toggleResp(s, id) {
    if (s.over || s.pending.length) return null;
    const r = findResp(s, id); if (!r) return null;
    if (s.career.resp.includes(id)) { removeResp(s, id); applyFx(s, { rep: -3 }); log(s, `You give up ${fmt(s, r.label)}.`, 'action'); return true; }
    if (!check(s, r.when, {}) || s.time < 1) return null;
    s.time -= 1; addResp(s, id); log(s, `You take on ${fmt(s, r.label)}.`, 'action'); return true;
  }
  function quals(s) {
    return D().quals.filter(q => check(s, q.show, {})).map(q => ({
      id: q.id, emoji: q.emoji, label: q.label, sub: q.sub, done: !!s.flags['qual_' + q.id],
      studying: s.study && s.study.id === q.id, left: s.study && s.study.id === q.id ? s.study.left : 0,
      ok: !s.study && !s.flags['qual_' + q.id] && check(s, q.when, {}) && s.time >= 1 && s.money >= (q.fee || 0), why: q.why || '',
    }));
  }
  function startQual(s, id) {
    const q = quals(s).find(x => x.id === id); if (!q || !q.ok) return null;
    const Q = D().quals.find(x => x.id === id);

  /* ---------- Money ---------- */
  function annualNet(g) {
    const pa = 12570, tax = Math.max(0, Math.min(g, 50270) - pa) * 0.2 + Math.max(0, Math.min(g, 125140) - 50270) * 0.4 + Math.max(0, g - 125140) * 0.45;
    const ni = Math.max(0, Math.min(g, 50270) - pa) * 0.08 + Math.max(0, g - 50270) * 0.02;

  }
  function salary(s) { return Math.round(ROLES[s.career.role].pay(s) * smod(s, 'payX', 1) / 100) * 100; }
  function budget(s) {
    const net = annualNet(salary(s) + (s.flags.bonus || 0)) / 6;
    const kids = s.people.filter(p => p.role === 'child').length;
    const costs = { home: s.home.cost || 0, living: Math.round(1300 + net * 0.18 + (s.flags.married ? 400 : 0)), kids: kids * 900, study: s.study ? (D().quals.find(q => q.id === s.study.id).perHt || 0) : 0 };

  /* ---------- Advance one half-term ---------- */

    for (const id of s.career.resp) { const r = D().resp.find(x => x.id === id); if (r) d += r.drain || 0; }
    if (s.study) d += D().quals.find(q => q.id === s.study.id).drain || 0;
    d += s.people.filter(p => p.role === 'child' && p.age < 5).length * 3;
    if (s.flags.tutoring) d += 3;
    d -= (s.hidden.organisation - 50) * 0.08;

  function snapshot(s) {

  function advance(s) {
    if (s.over || s.pending.length) return false;

    const drain = workload(s);
    s.stats.energy = clamp(s.stats.energy - drain);
    const burnt = s.stats.energy <= 0;
    if (s.stats.teaching < 80) s.stats.teaching = clamp(s.stats.teaching + (80 - s.stats.teaching) * 0.01 + (s.hidden.ambition - 50) * 0.004);
    const target = s.stats.teaching * 0.45 + s.hidden.organisation * 0.2 + s.stats.energy * 0.2 + s.stats.morale * 0.15;
    s.career.perf = clamp(s.career.perf * 0.7 + target * 0.3);
    const repTarget = 22 + s.career.perf * 0.45 + s.career.resp.length * 4 + ROLES[s.career.role].rank * 4 + (s.hidden.charisma - 50) * 0.1;
    s.stats.rep = clamp(s.stats.rep + (repTarget - s.stats.rep) * 0.06);
    const partner = byRole(s, 'partner');
    const moraleBase = 52 + smod(s, 'moraleBase', 0) + (s.stats.energy - 50) * 0.25 + (partner ? (partner.rel - 50) * 0.15 : -3) + (s.hidden.patience - 50) * 0.08 + (s.money < 0 ? -8 : 0);
    s.stats.morale = clamp(s.stats.morale + (moraleBase - s.stats.morale) * 0.18);

      if (p.role === 'partner') p.rel = clamp(p.rel - (s.tick - p.seen > 1 ? 4 : 1));
      else if (p.role === 'head' && smod(s, 'headDrift', null) != null) p.rel = clamp(p.rel + (smod(s, 'headDrift', 50) - p.rel) * 0.12);
      else if (s.tick - p.seen > 3) p.rel = clamp(p.rel + (50 - p.rel) * 0.06);
    }
    if (s.study) {
      s.study.left--;
      if (s.study.left <= 0) {
        const Q = D().quals.find(q => q.id === s.study.id);
        s.flags['qual_' + Q.id] = true; s.study = null;
        log(s, `🎓 You complete ${Q.label}.`, 'sys'); applyFx(s, Q.done, {});
      }
    }
    // 2. the break
    const hol = s.holiday;
    const frac = Math.min(0.98, h.rest + (hol ? hol.rest / 100 : 0) - (s.flags.resident && h.rest < 0.5 ? 0.08 : 0));
    const rest = (100 - s.stats.energy) * frac;
    s.stats.energy = clamp(s.stats.energy + rest);
    s.stats.morale = clamp(s.stats.morale + rest / 8 + (hol ? hol.morale : 0));
    if (hol) log(s, `🧳 ${h.brk[0].toUpperCase() + h.brk.slice(1)}: ${hol.text}`, 'sys');
    else if (h.rest >= 0.6) log(s, `🏖️ The ${h.brk} arrive. You sleep until ten for a week.`, 'sys');
    s.holiday = null;
    // 3. move the calendar
    s.tick++; s.ht = (s.ht + 1) % 6;
    if (s.ht === 0) { s.ay++; s.me.age++; }

    if (s.ht === 0) newYear(s);
    if (s.over) return true;

    const b = budget(s);
    s.money += b.net + b.extra - b.out;

    if (burnt) startEvent(s, 'burnout');

    { id: 'head_governors', emoji: '🏛️', title: 'Governors', tags: ['career', 'head'], when: { role: 'Head' }, weight: 10, cooldown: 3,

      text: 'The Registrar brings next year\'s numbers. Year 3 entry is down by eleven pupils.',
      choices: [
        { label: 'Launch a marketing push', text: 'New brochures, a video with a drone, and a "taster day". Numbers recover. The Bursar winces at the bill.', fx: { money: 0, rep: 4, energy: -6, rel: { bursar: -6 } } },
        { label: 'Visit every local nursery yourself', text: 'Forty nurseries in six weeks. You become very good at singing Wind the Bobbin Up.', fx: { rep: 5, energy: -10, karma: 1 } },

        { label: 'Push back', outcomes: [

          { w: 1, text: 'The board thank you for your input and proceed anyway.', fx: { morale: -6 } } ] },
      ] },
    { id: 'head_mudders_dog', emoji: '🐕', title: 'The Head\'s dog', tags: ['career', 'head', 'school'], when: { role: 'Head', school: 'mudgrove' }, weight: 8, cooldown: 6,
      text: 'At Mudders, the Head walks the dogs round the lake every morning. The boys now ask you about their problems on the walk.', fx: { morale: 6, karma: 2, rep: 2 } },

</script>
<script>
/* Prep School Life — UI */
(function () {
  'use strict';
  const P = window.PSL, D = window.PSL_DATA;
  const $app = document.getElementById('app');
  const SAVE = 'psl.save.v1', HOF = 'psl.hof.v1';
  let S = null;            // game state
  let result = null;       // outcome card waiting to be shown
  let sheet = null;        // {tab} or {person:id}
  let scrollBottom = true;

  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // In the iOS app, saves go to native storage via the "store" handler; on the web, localStorage.
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
  const nativeData = window.__NATIVE_STORE || {};
  const store = {
    get(k) {
      try { return JSON.parse(NATIVE ? (nativeData[k] == null ? 'null' : nativeData[k]) : localStorage.getItem(k)); } catch (e) { return null; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      if (NATIVE) { nativeData[k] = s; try { window.webkit.messageHandlers.store.postMessage({ k, v: s }); } catch (e) { } return; }
      try { localStorage.setItem(k, s); } catch (e) { }
    },
    del(k) {
      if (NATIVE) { delete nativeData[k]; try { window.webkit.messageHandlers.store.postMessage({ k }); } catch (e) { } return; }
      try { localStorage.removeItem(k); } catch (e) { }
    },
  };
  const haptic = kind => {
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haptic) window.webkit.messageHandlers.haptic.postMessage(kind || 'light'); else if (navigator.vibrate) navigator.vibrate(12); } catch (e) { }
  };
  const save = () => { if (S) store.set(SAVE, S); };
  const barColour = v => v >= 60 ? 'var(--good)' : v >= 30 ? 'var(--mid)' : 'var(--bad)';
  const crestSVG = (fill = '#f1d38a') => `<svg viewBox="0 0 44 48"><path d="M3 4h38v18c0 13-9 21-19 24C12 43 3 35 3 22z" fill="${fill}" stroke="#fff" stroke-width="1.5"/><path d="M3 15h38" stroke="#8a2433" stroke-width="3"/></svg>`;

  const HELP = `<div class="pop" style="border-top-color:var(--gold);max-height:88vh;overflow-y:auto;text-align:left"><div class="big">🔔</div><h2>How to play</h2>
    <p style="text-align:left;font-size:14px"><b>Tap Next ½</b> to move on one half-term. Six per school year, from Michaelmas to the summer holidays.</p>
    <p style="text-align:left;font-size:14px"><b>Time.</b> You get four ⏱ each half-term. Spend them in Activities, People and Career.</p>
    <p style="text-align:left;font-size:14px"><b>Energy.</b> Your job drains it every half-term (see Workload). Holidays give some back. Let it hit zero and you burn out.</p>
    <p style="text-align:left;font-size:14px"><b>Promotion.</b> Pass your two-year ECT induction, build Teaching and Reputation, then apply in Lent or early Summer when a post comes up.</p>
    <p style="text-align:left;font-size:14px"><b>Hidden stats.</b> Patience, Organisation, Charisma, Ambition and Karma shape every outcome. You only see them at the end.</p>
    <p style="text-align:left;font-size:14px"><b>Schools.</b> Each school plays differently. Some reward things they never mention.</p>
    <p style="text-align:left;font-size:13px;color:var(--muted)">Tap your crest for the sandbox: edit stats, fire events, rewind time.</p>
    <button class="choice" id="helpok">Ring the bell</button></div>`;
  function showHelp() { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = HELP; $app.appendChild(m); m.querySelector('#helpok').onclick = () => { S.helpSeen = true; save(); render(); }; }
  /* ---------------- Start screen ---------------- */
  function renderStart() {
    const saved = store.get(SAVE);
    const hof = store.get(HOF) || [];
    const subj = D.subjects.map(s => `<option${s === 'Latin' ? ' selected' : ''}>${s}</option>`).join('');
    $app.innerHTML = `<div class="start">
      <div class="bigcrest">${crestSVG()}<span style="position:absolute;inset:0;display:grid;place-items:center;font:700 22px Fraunces,serif;color:#18233d;padding-bottom:8px">PSL</span></div>
      <h1>Prep School Life</h1>
      <p class="tag">From ECT to Head, one half-term at a time.</p>
      ${saved && !saved.over ? `<button class="btn green" id="cont">Continue as ${esc(saved.me.title + ' ' + saved.me.last)}<br><small style="font-weight:400;opacity:.8">${esc(P.roleLabel(saved))}, ${esc(saved.school.name)}</small></button>` : ''}
      <div class="two"><div><label>First name</label><input id="f" placeholder="Random"></div><div><label>Surname</label><input id="l" placeholder="Random"></div></div>
      <div class="two"><div><label>Title</label><select id="t"><option value="">Random</option><option>Mr</option><option>Mrs</option><option>Ms</option><option>Miss</option><option>Dr</option></select></div>
      <div><label>Gender</label><select id="g"><option value="">Random</option><option value="m">Male</option><option value="f">Female</option></select></div></div>
      <div class="two"><div><label>Subject</label><select id="s"><option value="">Random</option>${subj}</select></div>
      <div><label>Start age</label><select id="a"><option value="">Random</option>${[22, 23, 24, 25, 26, 27, 28, 30, 35].map(n => `<option>${n}</option>`).join('')}</select></div></div>
      <label>School</label><select id="sc"><option value="random">Random</option>${D.schools.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <div id="blurb" style="font-size:12.5px;opacity:.75;margin-top:6px;min-height:34px"></div>
      <button class="btn" id="go">Start a career</button>
      <button class="btn ghost" id="rand">Random teacher</button>
      <p style="font-size:12px;opacity:.55;text-align:center;margin-top:18px">v1.1 · ${D.events.length} events · 4 schools${NATIVE ? '' : '<br>On iPhone: open in Safari, tap Share, then Add to Home Screen.'}</p>
      ${hof.length ? `<h3 style="margin:26px 0 6px">Honours board</h3>${hof.slice(-15).reverse().map(h => `<div class="hof"><span>${esc(h.emoji)} <b>${esc(h.name)}</b><br><small style="opacity:.7">${esc(h.peak)} · ${h.years} yrs · ${esc(h.ending)}</small></span><span style="text-align:right;color:#f1d38a">${esc(h.honour)}</span></div>`).join('')}` : ''}
    </div>`;
    const v = id => document.getElementById(id).value.trim();
    document.getElementById('go').onclick = () => begin({ first: v('f'), last: v('l'), title: v('t'), gender: v('g'), subject: v('s'), age: +v('a') || undefined, school: v('sc') });
    const sc = document.getElementById('sc'), bl = document.getElementById('blurb');
    sc.onchange = () => { const t = D.schools.find(x => x.id === sc.value); bl.textContent = t ? `${t.blurb} ${t.boarding ? 'Boarding' : 'Day'}, ${t.gender}.` : 'A school picked at random.'; }; sc.onchange();
    document.getElementById('rand').onclick = () => begin({});
    const c = document.getElementById('cont'); if (c) c.onclick = () => { S = saved; render(); };
  }
  function begin(o) {
    Object.keys(o).forEach(k => { if (!o[k]) delete o[k]; });
    if (o.title === 'Mr') o.gender = o.gender || 'm';
    if (['Mrs', 'Ms', 'Miss'].includes(o.title)) o.gender = o.gender || 'f';
    S = P.newGame(o); result = null; sheet = null; save(); render();
  }

  /* ---------------- Main game ---------------- */
  function render() {
    if (!S) return renderStart();
    if (S.over) return renderEnd();
    const st = S.stats, drain = Math.round(P.workload(S));
    const statHTML = P.VISIBLE.map(k => `<div class="stat"><div class="row"><span>${P.STAT_LABEL[k]}</span><b>${Math.round(st[k])}%</b></div><div class="bar"><i style="width:${st[k]}%;background:${barColour(st[k])}"></i></div></div>`).join('');
    const pips = Array.from({ length: S.maxTime }, (_, i) => `<span class="pip ${i < S.time ? 'on' : ''}"></span>`).join('');
    const danger = st.energy - drain <= 0;
    const jl = S.log.slice(-60).map(sec => `<div class="sec"><h3>${esc(sec.h)}<small>${esc(sec.sub)}</small></h3>${sec.lines.map(l => `<div class="line ${l.k}">${esc(l.t)}</div>`).join('')}</div>`).join('');
    $app.innerHTML = `
      <div class="hdr">
        <button class="crest" id="sandbox" aria-label="Sandbox">${crestSVG()}<span>${esc(S.me.first[0] + S.me.last[0])}</span></button>
        <div class="who"><b>${esc(P.myName(S))}</b><small>${esc(P.roleLabel(S))}${S.career.team && S.flags.coach ? ' · ' + esc(S.career.team) + ' coach' : ''}</small><small>${esc(S.school.name)}</small></div>
        <div class="purse">Age ${S.me.age}<b>${P.money(S.money)}</b></div>
      </div>
      <div class="stats">${statHTML}
        <div class="timebar"><span class="pips">Time ${pips}</span><span class="${danger ? 'warn' : ''}">Workload −${drain} energy${danger ? ' ⚠️' : ''}</span></div>
      </div>
      <div class="journal" id="journal">${jl}</div>
      <nav class="nav">
        <button data-tab="career"><span class="ico">🎓</span>Career</button>
        <button data-tab="act"><span class="ico">📚</span>Activities</button>
        <button class="next" id="next" ${S.pending.length ? 'disabled' : ''}><span class="ico">🔔</span>Next ½</button>
        <button data-tab="people"><span class="ico">👥</span>People</button>
        <button data-tab="life"><span class="ico">🏡</span>Life</button>
      </nav>`;
    const j = document.getElementById('journal');
    if (scrollBottom) j.scrollTop = j.scrollHeight;
    $app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { sheet = { tab: b.dataset.tab }; render(); });
    document.getElementById('next').onclick = () => { haptic('light'); if (P.advance(S)) { scrollBottom = true; save(); render(); } };
    document.getElementById('sandbox').onclick = () => { sheet = { tab: 'sandbox' }; render(); };
    if (!S.helpSeen) return showHelp();
    if (sheet) renderSheet();
    if (result) renderResult();
    else if (S.pending.length) renderEvent();
  }

  function after(res) {
    if (res && res.text != null && !res.started) { result = res; const net = (res.fx || []).reduce((a, f) => a + (f.money ? 0 : f.d), 0); haptic(net < 0 ? 'warning' : net > 0 ? 'success' : 'light'); }
    save();
    if (S.over) { sheet = null; result = null; }
    render();
  }

  /* ---------------- Event & result modals ---------------- */
  function renderEvent() {
    const ev = P.currentEvent(S); if (!ev) return;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="pop"><div class="big">${esc(ev.emoji)}</div><h2>${esc(ev.title)}</h2><p>${esc(ev.text)}</p>
      ${ev.choices.map(c => `<button class="choice" data-i="${c.i}" ${c.ok ? '' : 'disabled'}>${esc(c.label)}${!c.ok && c.why ? `<br><small>${esc(c.why)}</small>` : ''}</button>`).join('')}</div>`;
    $app.appendChild(m);
    m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const r = P.choose(S, +b.dataset.i); after(r && r.text ? r : null); });
  }
  function fxChips(fx) {
    if (!fx || !fx.length) return '';
    return `<div class="fx">${fx.map(f => `<span class="${f.d > 0 ? 'up' : 'dn'}">${esc(f.k)} ${f.money ? (f.d > 0 ? '+' : '−') + P.money(Math.abs(f.d)) : (f.d > 0 ? '+' : '−') + Math.abs(f.d)}</span>`).join('')}</div>`;
  }
  function renderResult() {
    const r = result;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="pop" style="border-top-color:var(--green)"><div class="big">${esc(r.emoji || '📜')}</div><h2>${esc(r.title || '')}</h2><p>${esc(r.text)}</p>${fxChips(r.fx)}<button class="choice" id="ok">Carry on</button></div>`;
    $app.appendChild(m);
    m.querySelector('#ok').onclick = () => { result = null; render(); };
  }

  /* ---------------- Sheets ---------------- */
  function item({ e, t, s, r, attrs = '', dis, on, bar }) {
    return `<button class="item ${on ? 'on' : ''}" ${attrs} ${dis ? 'disabled' : ''}><span class="e">${esc(e || '')}</span><span class="t"><b>${esc(t)}</b>${s ? `<small>${esc(s)}</small>` : ''}${bar != null ? `<div class="mini"><i style="width:${bar}%;background:${barColour(bar)}"></i></div>` : ''}</span><span class="r">${r || ''}</span></button>`;
  }
  const costTag = (c, ok, why) => c ? `<b style="color:var(--green)">${c} ⏱</b>${!ok && why ? `<br>${esc(why)}` : ''}` : (!ok && why ? esc(why) : '');

  function renderSheet() {
    const sc = document.createElement('div'); sc.className = 'scrim';
    let title = '', body = '';
    const tab = sheet.tab;
    if (sheet.person) { const o = personSheet(sheet.person); title = o.title; body = o.body; }
    else if (tab === 'act') { title = 'Activities'; body = actionsHTML('act'); }
    else if (tab === 'life') { title = 'Life'; body = lifeHTML(); }
    else if (tab === 'career') { title = 'Career'; body = careerHTML(); }
    else if (tab === 'people') { title = 'People'; body = peopleHTML(); }
    else if (tab === 'sandbox') { title = 'Sandbox'; body = sandboxHTML(); }
    sc.innerHTML = `<div class="sheet"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" id="close">✕</button></div><div class="sheet-b">${body}</div></div>`;
    $app.appendChild(sc);
    sc.onclick = e => { if (e.target === sc) { sheet = null; render(); } };
    sc.querySelector('#close').onclick = () => { sheet = sheet.person ? { tab: 'people' } : null; render(); };
    wireSheet(sc);
  }
  function timeNote() { return `<div class="card" style="padding:8px 12px;font-size:13px">Time left this half-term: <b>${S.time}</b> of ${S.maxTime} · Energy ${Math.round(S.stats.energy)}% · Workload −${Math.round(P.workload(S))}</div>`; }

  function actionsHTML(tab) {
    const list = P.actions(S, tab); let html = tab === 'act' ? timeNote() : '', g = null;
    for (const a of list) {
      if (a.group !== g) { g = a.group; html += `<div class="grp">${esc(g)}</div>`; }
      html += item({ e: a.emoji, t: a.label, s: a.sub, r: costTag(a.cost, a.ok, a.why), attrs: `data-act="${a.id}"`, dis: !a.ok });
    }
    return html;
  }
  function careerHTML() {
    const c = S.career, b = P.budget(S);
    let h = timeNote() + `<div class="card"><h3>${esc(P.roleLabel(S))}</h3>
      <div class="kv"><span>School</span><b>${esc(S.school.name)}</b></div>
      <div class="kv"><span>Type</span><span>${S.school.boarding ? 'Boarding' : 'Day'} · ${esc(S.school.gender)} · ${'★'.repeat(S.school.prestige)}</span></div>
      <div style="font-size:12.5px;color:var(--muted);padding:4px 0">${esc((D.schools.find(x => x.id === S.school.id) || {}).blurb || '')}</div>
      <div class="kv"><span>Years teaching</span><span>${c.years} (${c.yearsAtSchool} here, ${c.yearsInRole} in role)</span></div>
      <div class="kv"><span>Salary</span><span>${P.money(P.salary(S))} a year</span></div>
      <div class="kv"><span>Performance</span><span>${Math.round(c.perf)}%</span></div>
      ${c.role === 'ECT' ? `<div class="kv"><span>Induction</span><span>Teaching 38+ by end of year 2</span></div>` : ''}</div>`;
    const lad = P.ladder(S);
    h += `<div class="grp">Promotion</div>`;
    if (!lad.length) h += `<div class="card" style="font-size:13.5px">${c.role === 'ECT' ? 'Pass your induction first.' : c.role === 'Head' ? 'You are at the top.' : 'No promotion routes from here.'}</div>`;
    for (const L of lad) {
      const status = L.applied ? 'Applied this year' : !L.vacant ? 'No vacancy this year' : ![2, 3, 4].includes(S.ht) ? 'Applications: Lent and Summer ½1' : '';
      h += `<button class="item" data-apply="${L.role}" ${L.ok ? '' : 'disabled'}><span class="e">📈</span><span class="t"><b>Apply: ${esc(L.label)}${L.external ? ' (another school)' : ''}</b><small>${L.reqs.map(r => `<span class="req ${r.ok ? 'ok' : 'no'}">${r.ok ? '✓' : '✗'} ${esc(r.label)}</span>`).join('')}</small>${status ? `<small>${esc(status)}</small>` : ''}</span><span class="r"><b style="color:var(--green)">1 ⏱</b></span></button>`;
    }
    h += `<div class="grp">Responsibilities</div>`;
    for (const r of P.respList(S)) h += item({ e: r.emoji, t: r.label, s: `${r.sub} · −${r.drain} energy per half-term`, r: r.on ? 'Give up' : costTag(1, r.ok, r.why), attrs: `data-resp="${r.id}"`, dis: !r.ok, on: r.on });
    h += `<div class="grp">Qualifications</div>`;
    for (const q of P.quals(S)) h += item({ e: q.emoji, t: q.label, s: q.done ? 'Completed' : q.studying ? `Studying · ${q.left} half-terms left` : q.sub, r: q.done || q.studying ? '' : costTag(1, q.ok, q.why), attrs: `data-qual="${q.id}"`, dis: !q.ok, on: q.done || q.studying });
    h += `<div class="grp">Move on</div>` + item({ e: '🧳', t: 'Look for a job at another school', s: 'Same role, new school · Lent only', r: costTag(1, [2, 3].includes(S.ht) && S.time >= 1, ''), attrs: 'data-move="1"', dis: !([2, 3].includes(S.ht) && S.time >= 1) || S.career.role === 'ECT' });
    return h;
  }
  function peopleHTML() {
    const groups = [['Staff', ['head', 'deputy', 'slt', 'hod', 'bursar', 'matron', 'colleague']], ['Pupils', ['pupil']], ['Parents', ['parent']], ['Family', ['partner', 'child']]];
    let h = '';
    for (const [g, roles] of groups) {
      const ps = S.people.filter(p => roles.includes(p.role)); if (!ps.length) continue;
      h += `<div class="grp">${g}</div>`;
      for (const p of ps) h += item({ e: { head: '🎩', deputy: '📋', hod: '📘', bursar: '💼', matron: '🩹', slt: '📏', colleague: '🧑‍🏫', pupil: p.g === 'f' ? '👧' : '👦', parent: '🧥', partner: '❤️', child: '🧸' }[p.role], t: P.dispName(p) + (p.role === 'pupil' ? '' : ''), s: P.personRoleLabel(S, p), bar: Math.round(p.rel), r: '›', attrs: `data-person="${p.id}"` });
    }
    return h;
  }
  function personSheet(id) {
    const p = S.people.find(x => x.id === id); if (!p) { sheet = { tab: 'people' }; return { title: 'People', body: peopleHTML() }; }
    let h = `<div class="card"><h3>${esc(p.role === 'pupil' ? p.first + ' ' + p.last : P.dispName(p))}</h3>
      <div class="kv"><span>${esc(P.personRoleLabel(S, p))}</span><span>${p.role === 'pupil' || p.role === 'child' ? '' : esc(p.first + ' ' + p.last)}</span></div>
      <div class="kv"><span>Relationship</span><b>${Math.round(p.rel)}%</b></div>
      ${p.role !== 'child' ? `<div class="kv"><span>Known for</span><span style="text-align:right">${esc(p.quirk)}</span></div>` : ''}
      <div class="mini"><i style="width:${p.rel}%;background:${barColour(p.rel)}"></i></div></div><div class="grp">Interact · ${S.time} time left</div>`;
    for (const a of P.personActions(S, id)) h += item({ e: a.emoji, t: a.label, s: a.sub, r: costTag(a.cost, a.ok, a.why), attrs: `data-pact="${a.id}"`, dis: !a.ok });
    return { title: P.dispName(p), body: h };
  }
  function lifeHTML() {
    const b = P.budget(S);
    let h = `<div class="card"><h3>Money</h3>
      <div class="kv"><span>Take-home pay</span><span>${P.money(b.net)} per half-term</span></div>
      ${b.extra ? `<div class="kv"><span>Tutoring</span><span>${P.money(b.extra)}</span></div>` : ''}
      <div class="kv"><span>${esc(S.home.label)}</span><span>−${P.money(b.costs.home)}</span></div>
      <div class="kv"><span>Living costs</span><span>−${P.money(b.costs.living)}</span></div>
      ${b.costs.kids ? `<div class="kv"><span>Children</span><span>−${P.money(b.costs.kids)}</span></div>` : ''}
      ${b.costs.study ? `<div class="kv"><span>Course fees</span><span>−${P.money(b.costs.study)}</span></div>` : ''}
      <div class="kv"><span><b>Each half-term</b></span><b>${P.money(b.net + b.extra - b.out)}</b></div>
      <div class="kv"><span>Net worth</span><span>${P.money(P.netWorth(S))}</span></div></div>`;
    h += `<div class="grp">Next break · ${esc(P.HT[S.ht].brk)}</div>`;
    for (const hol of D.holidays) h += item({ e: { home: '🛋️', family: '👪', cottage: '🌧️', abroad: '☀️', ski: '⛷️' }[hol.id], t: hol.label, s: hol.price ? P.money(hol.price) : 'Free', on: S.holiday && S.holiday.id === hol.id, attrs: `data-hol="${hol.id}"`, dis: hol.price > S.money + (S.holiday ? S.holiday.price : 0) });
    h += `<div class="grp">Home</div>` + `<div class="card" style="font-size:13.5px">You live in: <b>${esc(S.home.label)}</b></div>`;
    for (const o of P.housing(S)) h += item({ e: o.id === 'sell' ? '🏷️' : o.id === 'house' ? '🏡' : o.id === 'school' ? '🏫' : '🏢', t: o.label, s: o.sub, attrs: `data-home="${o.id}"`, dis: !o.ok });
    h += actionsHTML('life');
    h += `<div class="grp">Help</div><button class="item" id="helpbtn"><span class="e">❓</span><span class="t"><b>How to play</b></span></button>`;
    return h;
  }
  function sandboxHTML() {
    const all = P.VISIBLE.concat(P.HIDDEN);
    let h = `<div class="card" style="font-size:13px">Testing tools. Hidden stats are shown here only.</div>`;
    for (const k of all) { const v = Math.round(k in S.stats ? S.stats[k] : S.hidden[k]); h += `<label style="font-size:12.5px;display:flex;justify-content:space-between">${P.STAT_LABEL[k]}${P.HIDDEN.includes(k) ? ' (hidden)' : ''}<b id="v_${k}">${v}</b></label><input type="range" min="0" max="100" value="${v}" data-sb="${k}">`; }
    h += `<div class="grp">Quick</div>
      <button class="item" data-sbq="money"><span class="e">💷</span><span class="t"><b>+£10,000</b></span></button>
      <button class="item" data-sbq="time"><span class="e">⏱</span><span class="t"><b>Refill time</b></span></button>
      <div class="grp">Set role</div><select id="sbrole" style="width:100%;padding:10px;border-radius:10px">${Object.keys(P.ROLES).map(r => `<option ${r === S.career.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <div class="grp">Fire an event</div><select id="sbev" style="width:100%;padding:10px;border-radius:10px">${D.events.map(e => `<option value="${e.id}">${e.id}${e.manual ? ' (manual)' : ''} · fired ${S.fired[e.id] || 0}</option>`).join('')}</select>
      <button class="choice" id="sbfire">Fire event</button>
      <div class="grp">Time machine</div>`;
    (S.snaps || []).slice().reverse().forEach((sn, i) => { const idx = S.snaps.length - 1 - i; h += item({ e: '⏪', t: 'Back to ' + sn.label, attrs: `data-rewind="${idx}"` }); });
    h += `<div class="grp">Save data</div><textarea id="sbjson" readonly>${esc(JSON.stringify(Object.assign({}, S, { snaps: undefined })))}</textarea>
      <button class="choice alt" id="sbcopy">Copy save</button>
      <button class="choice alt" id="sbmenu">Main menu</button>`;
    return h;
  }

  function wireSheet(sc) {
    sc.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const r = P.doAction(S, b.dataset.act); if (r && r.started) sheet = null; after(r); });
    sc.querySelectorAll('[data-pact]').forEach(b => b.onclick = () => { const r = P.doAction(S, b.dataset.pact, sheet.person); if (r && r.started) sheet = null; after(r); });
    sc.querySelectorAll('[data-person]').forEach(b => b.onclick = () => { sheet = { person: b.dataset.person }; render(); });
    sc.querySelectorAll('[data-apply]').forEach(b => b.onclick = () => { if (P.apply(S, b.dataset.apply)) { sheet = null; after(null); } });
    sc.querySelectorAll('[data-resp]').forEach(b => b.onclick = () => { P.toggleResp(S, b.dataset.resp); after(null); });
    sc.querySelectorAll('[data-qual]').forEach(b => b.onclick = () => { P.startQual(S, b.dataset.qual); after(null); });
    sc.querySelectorAll('[data-hol]').forEach(b => b.onclick = () => { P.setHoliday(S, b.dataset.hol); after(null); });
    sc.querySelectorAll('[data-home]').forEach(b => b.onclick = () => { P.setHome(S, b.dataset.home); after(null); });
    const mv = sc.querySelector('[data-move]'); if (mv) mv.onclick = () => { S.time -= 1; P.startEvent(S, 'job_hunt', {}); sheet = null; after(null); };
    sc.querySelectorAll('[data-sb]').forEach(r => r.oninput = () => { P.sandboxSet(S, r.dataset.sb, r.value); document.getElementById('v_' + r.dataset.sb).textContent = r.value; save(); });
    sc.querySelectorAll('[data-sbq]').forEach(b => b.onclick = () => { if (b.dataset.sbq === 'money') S.money += 10000; else S.time = S.maxTime; after(null); });
    const role = sc.querySelector('#sbrole'); if (role) role.onchange = () => { S.career.role = role.value; after(null); };
    const fire = sc.querySelector('#sbfire'); if (fire) fire.onclick = () => { const ok = P.forceEvent(S, sc.querySelector('#sbev').value); if (!ok) fire.textContent = 'Could not fire (no one to cast)'; else { sheet = null; after(null); } };
    sc.querySelectorAll('[data-rewind]').forEach(b => b.onclick = () => { const st = P.rewind(S, +b.dataset.rewind); if (st) { S = st; sheet = null; result = null; after(null); } });
    const cp = sc.querySelector('#sbcopy'); if (cp) cp.onclick = () => { const t = sc.querySelector('#sbjson'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => cp.textContent = 'Copied', () => cp.textContent = 'Select and copy above'); } catch (e) { cp.textContent = 'Select and copy above'; } };
    const hb = sc.querySelector('#helpbtn'); if (hb) hb.onclick = () => { S.helpSeen = false; sheet = null; render(); };
    const mn = sc.querySelector('#sbmenu'); if (mn) mn.onclick = () => { save(); S = null; sheet = null; render(); };
  }

  /* ---------------- Ending ---------------- */
  function renderEnd() {
    const e = S.ending;
    if (!S.hofSaved) {
      const hof = store.get(HOF) || [];
      hof.push({ name: e.name, emoji: e.emoji, peak: e.peak, years: e.years, ending: e.title, honour: e.honour.title });
      store.set(HOF, hof.slice(-50)); S.hofSaved = true; save();
    }
    const hid = P.HIDDEN.map(k => `<div class="kv"><span>${P.STAT_LABEL[k]}</span><b>${Math.round(e.hidden[k])}</b></div>`).join('');
    $app.innerHTML = `<div class="end"><div class="endcard">
      <div style="font-size:48px">${esc(e.emoji)}</div>
      <h1 style="margin:6px 0 0;color:var(--navy)">${esc(e.name)}</h1>
      <div style="color:var(--muted)">${esc(e.subject)} teacher · ${e.years} years in teaching · ${e.id === 'retire' ? 'retired' : e.id === 'died' ? 'died' : 'left'} at ${e.age}</div>
      <p style="margin:12px 0 0"><b>${esc(e.title)}.</b> ${esc(e.text)}</p>
      <div class="ribbon">${esc(e.honour.emoji)} ${esc(e.honour.title)}</div>
      <div style="font-size:13.5px;color:var(--muted)">${esc(e.honour.text)}</div>
      <div class="card" style="text-align:left">
        <div class="kv"><span>Highest post</span><b>${esc(e.peak)}</b></div>
        <div class="kv"><span>Schools</span><span style="text-align:right">${esc(e.schools.join(', '))}</span></div>
        <div class="kv"><span>Pupils waved off</span><span>${e.leavers}</span></div>
        <div class="kv"><span>Net worth</span><span>${P.money(e.money)}</span></div>
      </div>
      <div class="card" style="text-align:left"><h3>What they never told you</h3>${hid}${e.hambrook ? `<div class="kv"><span>Sundays in the Hambrook pew</span><b>${e.pews}</b></div><div style="font-size:12.5px;color:var(--muted);margin-top:6px">${e.pews >= 6 ? 'At Hambrook, the road to SLT ran through St Michael\'s. You found it.' : 'At Hambrook, the road to SLT ran through St Michael\'s. Now you know.'}</div>` : ''}</div>
      <button class="btn" id="again">New career</button>
      <button class="btn ghost" style="color:var(--navy);border-color:var(--line)" id="journal">Read the journal</button>
    </div></div>`;
    document.getElementById('again').onclick = () => { store.del(SAVE); S = null; render(); };
    document.getElementById('journal').onclick = () => {
      $app.innerHTML = `<div class="hdr"><div class="who"><b>${esc(e.name)}</b><small>The full journal</small></div><button class="x" style="color:#fff" id="back">✕</button></div><div class="journal">${S.log.map(sec => `<div class="sec"><h3>${esc(sec.h)}<small>${esc(sec.sub)}</small></h3>${sec.lines.map(l => `<div class="line ${l.k}">${esc(l.t)}</div>`).join('')}</div>`).join('')}</div>`;
      document.getElementById('back').onclick = renderEnd;
    };
  }

  // boot
  const saved = store.get(SAVE);
  S = null;
  render();
})();

</script>
</body>
</html>
